name: Deploy Alexandria to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alexandria-pages-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The repository is currently also configured for GitHub's automatic
      # branch/Jekyll Pages build. That generated deployment renders README.md
      # and has been finishing a few seconds after this app deployment,
      # overwriting Alexandria. Wait long enough for that legacy deployment to
      # finish, then publish the real Next.js export last.
      #
      # Once Pages > Build and deployment > Source is switched to
      # "GitHub Actions", this delay can be removed.
      - name: Avoid legacy Pages deployment race
        run: sleep 90

      - name: Deploy Alexandria app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
