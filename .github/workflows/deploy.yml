name: Deploy Alexandria to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alexandria-pages-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Validate exported site
        run: |
          test -f out/index.html
          test -d out/_next/static
          touch out/.nojekyll
          printf '%s\n' "Alexandria deployment $(git rev-parse HEAD)" > out/health.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # This repository still has GitHub's legacy branch/Jekyll Pages build enabled.
      # It races the real app deployment. Keep the app deployment last until the
      # repository Pages source is changed to "GitHub Actions" in Settings > Pages.
      - name: Avoid legacy Pages deployment race
        run: sleep 120

      - name: Deploy Alexandria app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
